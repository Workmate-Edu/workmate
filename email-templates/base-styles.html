<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary: #10b981;
            --primary-light: rgba(16, 185, 129, 0.1);
            --muted: #f3f4f6;
            --border: #e5e7eb;
            --text: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f9fafb;
            margin: 0;
            padding: 0;
            color: var(--text);
        }

        .email-container {
            max-width: 600px;
            margin: 20px auto;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .email-header {
            text-align: center;
            padding: 32px 24px;
            background-color: var(--primary);
            color: white;
        }

        .logo {
            width: 120px;
            height: auto;
            margin: 0 auto;
            display: block;
        }

        .email-content {
            padding: 32px 24px;
            color: var(--text);
        }

        .button-primary {
            display: inline-block;
            padding: 12px 24px;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            margin: 16px 0;
        }

        .info-card {
            background-color: var(--muted);
            border-radius: 8px;
            padding: 20px;
            margin: 16px 0;
        }

        .email-footer {
            background-color: var(--muted);
            padding: 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
</html>
