<h1 style="margin:0 0 24px;color:{{brandText}};font-size:26px;font-weight:700;line-height:1.3;">{{notificationType}}</h1>
<p style="margin:0 0 16px;line-height:1.6;">Hello {{recipientName}},</p>
<p style="margin:0 0 16px;line-height:1.6;">{{mainMessage}}</p>
<div class="info-card" style="background-color:{{brandBackgroundAccent}};border:1px solid {{brandBorder}};border-radius:8px;padding:20px;margin:20px 0;">
<h3 style="margin-top:0;font-size:18px;font-weight:700;line-height:1.4;margin:0 0 12px;color:{{brandText}};">Assessment Details</h3>
<ul class="details-list">
<li>
<span class="label">Title</span>
<span class="value">{{title}}</span>
</li>
<li>
<span class="label">Subject</span>
<span class="value">{{subject}}</span>
</li>
<li>
<span class="label">Due Date</span>
<span class="value">{{dueDate}}</span>
</li>
<li>
<span class="label">Total Points</span>
<span class="value">{{totalPoints}} points</span>
</li>
<li>
<span class="label">Type</span>
<span class="value">{{type}}</span>
</li>
<li>
<span class="label">Description</span>
<span class="value">{{description}}</span>
</li>
</ul>
</div>
<div style="text-align:center;">
<a href="{{assessmentUrl}}" class="button-primary" style="display:inline-block;padding:12px 24px;margin:8px 0;border-radius:6px;background-color:{{brandPrimary}};color:{{brandText}};font-family:Inter,Arial,Helvetica,sans-serif;font-size:16px;font-weight:600;line-height:1.5;text-align:center;text-decoration:none;mso-padding-alt:12px 24px;">
View Assessment
</a>
</div>
