<h1 style="margin:0 0 24px;color:{{brandText}};font-size:26px;font-weight:700;line-height:1.3;">Teacher Assignment Update</h1>
<p style="color:{{brandText}};line-height:1.6;margin:0 0 16px;">Dear {{parentName}},</p>
<p style="color:{{brandText}};line-height:1.6;margin:0 0 16px;">
We're pleased to inform you that a teacher has been assigned for {{childName}}'s lessons.
</p>
<div style="background-color:{{brandBackgroundAccent}};padding:20px;border-radius:8px;margin:20px 0;">
<h3 style="margin-top:0;color:{{brandText}};font-size:18px;font-weight:700;line-height:1.4;margin:0 0 12px;">Assignment Details:</h3>
<ul style="color:{{brandText}};line-height:1.6;">
<li>Teacher: {{teacherName}}</li>
<li>Subjects: {{subjects}}</li>
<li>Grade Level: {{grade}}</li>
</ul>
</div>
<div style="text-align:center;margin:30px 0;">
<a href="{{dashboardUrl}}" style="display:inline-block;padding:12px 24px;margin:8px 0;border-radius:6px;background-color:{{brandPrimary}};color:{{brandText}};font-family:Inter,Arial,Helvetica,sans-serif;font-size:16px;font-weight:600;line-height:1.5;text-align:center;text-decoration:none;mso-padding-alt:12px 24px;" class="button-primary">
View Details in Dashboard
</a>
</div>
