<h1 style="margin:0 0 24px;color:{{brandText}};font-size:26px;font-weight:700;line-height:1.3;">Event Invitation</h1>
<p style="margin:0 0 16px;line-height:1.6;">You have been invited to:</p>
<div class="event-details" style="background-color:{{brandBackgroundAccent}};border:1px solid {{brandBorder}};border-radius:8px;padding:20px;margin:20px 0;">
<h2 style="font-size:18px;font-weight:700;line-height:1.4;margin:0 0 12px;color:{{brandText}};">{{eventTitle}}</h2>
<div class="event-time">
<p style="margin:0 0 16px;line-height:1.6;"><strong>Start:</strong> {{startTime}}</p>
<p style="margin:0 0 16px;line-height:1.6;"><strong>End:</strong> {{endTime}}</p>
</div>
{{#if meetLink}}
<a href="{{meetLink}}" class="button-primary" style="display:inline-block;padding:12px 24px;margin:8px 0;border-radius:6px;background-color:{{brandPrimary}};color:{{brandText}};font-family:Inter,Arial,Helvetica,sans-serif;font-size:16px;font-weight:600;line-height:1.5;text-align:center;text-decoration:none;mso-padding-alt:12px 24px;">Join Meeting</a>
{{/if}}
</div>
<p style="margin:0 0 16px;line-height:1.6;">Please click the link above to join the meeting at the scheduled time.</p>
