<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Event Invitation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #4a90e2;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 5px 5px 0 0;
        }
        .content {
            background-color: #f9f9f9;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 0 0 5px 5px;
        }
        .event-details {
            margin: 20px 0;
        }
        .event-time {
            color: #666;
            margin: 10px 0;
        }
        .meet-link {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin: 20px 0;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Event Invitation</h1>
    </div>
    <div class="content">
        <p>You have been invited to:</p>
        <div class="event-details">
            <h2>{{eventTitle}}</h2>
            <div class="event-time">
                <p><strong>Start:</strong> {{startTime}}</p>
                <p><strong>End:</strong> {{endTime}}</p>
            </div>
            {{#if meetLink}}
            <a href="{{meetLink}}" class="meet-link">Join Meeting</a>
            {{/if}}
        </div>
        <p>Please click the link above to join the meeting at the scheduled time.</p>
    </div>
    <div class="footer">
        <p>This is an automated message from Workmate Learning. Please do not reply to this email.</p>
    </div>
</body>
</html>
