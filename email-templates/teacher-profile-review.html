<h1 style="margin:0 0 24px;color:{{brandText}};font-size:26px;font-weight:700;line-height:1.3;">Teacher profile review needed</h1>
<p style="color:{{brandText}};line-height:1.6;margin:0 0 16px;">A teacher has updated their profile and is awaiting verification.</p>
<div style="background-color:{{brandBackgroundAccent}};padding:20px;border-radius:8px;margin:20px 0;">
  <p style="color:{{brandText}};line-height:1.6;margin:0 0 8px;"><strong>Teacher:</strong> {{teacherName}}</p>
  <p style="color:{{brandText}};line-height:1.6;margin:0;"><strong>Email:</strong> {{teacherEmail}}</p>
</div>
<p style="color:{{brandText}};line-height:1.6;margin:0 0 16px;">Review the updated profile and verify or reject it from the admin dashboard.</p>
<div style="text-align:center;margin:30px 0;"><a href="{{adminDashboardUrl}}" style="display:inline-block;padding:12px 24px;margin:8px 0;border-radius:6px;background-color:{{brandPrimary}};color:{{brandText}};font-family:Inter,Arial,Helvetica,sans-serif;font-size:16px;font-weight:600;line-height:1.5;text-align:center;text-decoration:none;">Review teacher profile</a></div>
